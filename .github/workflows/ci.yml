name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[llm,dev]"
      - name: Lint and type-check
        run: .venv/bin/ruff check src tests && .venv/bin/mypy
      - name: Build data and train NLU from scratch (reproducibility check)
        run: .venv/bin/sherlock generate && .venv/bin/sherlock train
      - name: Tests and acceptance gates (RCA >= 90% top-1, NLU >= 90%, dialogue >= 90%)
        run: .venv/bin/pytest -o addopts="" -q
      - uses: actions/upload-artifact@v4
        with: {name: reports, path: reports/}
