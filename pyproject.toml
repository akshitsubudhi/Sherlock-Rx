[project]
name = "sherlock-rx"
version = "0.1.0"
description = "Sherlock Rx: an NLP chatbot that diagnoses why pharma brands under-perform by region"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rapidfuzz>=3.9",
    "sqlglot>=25",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
ui = ["streamlit>=1.38", "plotly>=5.24"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
sherlock = "sherlock_rx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock_rx"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/sherlock_rx"]
exclude = ["src/sherlock_rx/ui/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
